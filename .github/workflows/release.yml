name: Release Installers

on:
  push:
    tags:
      - "v*"
    branches:
      - "release/v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.2.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    name: Windows release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build release package
        shell: pwsh
        env:
          SONRAPTUNE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: ./scripts/build-windows.ps1 -Package -Clean
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          if-no-files-found: error
          path: |
            dist/windows/*.zip
            dist/windows/*Setup.exe

  macos:
    name: macOS release
    runs-on: macos-14
    env:
      SONRAPTUNE_ARCHS: "arm64;x86_64"
      SONRAPTUNE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Build release package
        run: bash scripts/build-macos.sh --package --clean
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          if-no-files-found: error
          path: |
            dist/macos/*.zip
            dist/macos/*.pkg

  linux:
    name: Linux release
    runs-on: ubuntu-24.04
    env:
      SONRAPTUNE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Install JUCE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build build-essential pkg-config \
            libasound2-dev libjack-jackd2-dev \
            libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxcursor-dev libgl1-mesa-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build release package
        run: bash scripts/build-linux.sh --package --clean
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          if-no-files-found: error
          path: |
            dist/linux/*.tar.gz
            dist/linux/*.deb

  publish:
    name: Publish GitHub release
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Generate SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum * > SHA256SUMS.txt
      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RAW_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          RELEASE_TAG="${RAW_RELEASE_TAG#release/}"
          CREATE_FLAGS=(--generate-notes)
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "branch" ]]; then
            CREATE_FLAGS+=(--prerelease)
          fi
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "SonRapTune $RELEASE_TAG Public Beta" \
              "${CREATE_FLAGS[@]}"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
