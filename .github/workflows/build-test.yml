name: Build and Test

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build, test and package
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Package
      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: SonRapTune-Windows-x64
          if-no-files-found: error
          path: |
            dist/windows/*.zip
            dist/windows/*Setup.exe

  macos:
    name: macOS Universal
    runs-on: macos-14
    env:
      SONRAPTUNE_ARCHS: "arm64;x86_64"
    steps:
      - uses: actions/checkout@v4
      - name: Build, test and package
        run: bash scripts/build-macos.sh --package
      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: SonRapTune-macOS-Universal
          if-no-files-found: error
          path: |
            dist/macos/*.zip
            dist/macos/*.pkg

  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install JUCE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build build-essential pkg-config \
            libasound2-dev libjack-jackd2-dev \
            libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxcursor-dev libgl1-mesa-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build, test and package
        run: bash scripts/build-linux.sh --package
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: SonRapTune-Linux-x64
          if-no-files-found: error
          path: |
            dist/linux/*.tar.gz
            dist/linux/*.deb
